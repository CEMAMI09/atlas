packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Anything unlisted is refused (strictDepBuilds).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.101'
  - '@ai-sdk/provider-utils@5.0.52'
  - '@ai-sdk/provider@4.0.20'
  - '@ai-sdk/vue@4.0.123'
  - '@lucide/vue@1.49.0'
  - '@types/ws@8.18.2'
  - ai@7.0.123
