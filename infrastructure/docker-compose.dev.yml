services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas-postgres:/var/lib/postgresql/data

volumes:
  atlas-postgres:
